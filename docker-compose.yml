services:
  nginx:
      image: nginx:alpine
      container_name: nginx_proxy
      ports:
        - "80:80"    # Expose HTTP traffic
        - "443:443"  # Optional: For HTTPS/SSL later
      volumes:
        # Mounts your local config file directly inside the Nginx container
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - app
      restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    # volumes:
    #   - ./rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: demod
      RABBITMQ_DEFAULT_PASS: demo

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-app
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: demod
      SPRING_RABBITMQ_PASSWORD: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DOMAIN: http://localhost
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - db
    volumes:
      - ./uploadFolder:/data/uploads
      - ./logs:/app/logs
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    restart: unless-stopped
    volumes:
      - ./ui:/app
      - /app/node_modules
    depends_on:
      - app
  db:
    image: 'postgres:15.3-alpine'
    container_name: postgresdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]
    volumes:
      - ollama:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - 7070:8080
volumes:
  pgdata:
  ollama:
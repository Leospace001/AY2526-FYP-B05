server {
    listen 80;
    
    # You can leave this as localhost, or change it to your AWS domain name later
    server_name localhost; 

    location / {
        proxy_pass http://ui:5173; # 'backend' must match your docker-compose service name
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /db {
        proxy_pass http://adminer:8080; # 'backend' must match your docker-compose service name
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    

    # 1. API Routing: Forward all /api/ requests to the Spring Boot container
    location /api/ {
        if ($request_method = 'OPTIONS') {
            # Use $http_origin to dynamically allow the requester's domain
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Tell the browser to cache this preflight info for 20 days
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 2. Add CORS headers to the actual API response
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://app:8080; # 'backend' must match your docker-compose service name
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
    }

    # 2. Frontend Routing: Serve the compiled React static files
}
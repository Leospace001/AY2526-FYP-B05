server {
    listen 80;
    listen [::]:80;

    # You can leave this as localhost, or change it to your AWS domain name later
    server_name leospace.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leospace.cc;

    ssl_certificate /etc/letsencrypt/live/leospace.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leospace.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://ui/;

    }
    location /db {
        proxy_pass http://adminer:8080; # 'backend' must match your docker-compose service name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ollama/ {
        # The trailing slash is critical! It strips "/ollama" from the URL
        # before passing it to Ollama so "/ollama/api/chat" becomes "/api/chat"
        proxy_pass http://ollama:11434/;
        # Disable buffering so the frontend can receive streaming AI text in real-time
        proxy_buffering off;
        # 🚀 CRITICAL: LLMs take time to think. Increase timeout to 5 minutes!
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # You MUST add CORS headers here if you stripped them from Spring Boot earlier
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    # Forward API requests to Spring Boot — CORS/OPTIONS handled by Spring Security
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
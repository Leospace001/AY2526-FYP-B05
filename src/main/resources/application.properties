spring.datasource.url=jdbc:postgresql://db:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
file.upload-dir=${FILE_UPLOAD_DIR:/data/uploads/}
spring.rabbitmq.port=5672
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=demod
spring.rabbitmq.password=demo
spring.security.strategy=MODE_INHERITABLETHREADLOCAL
rabbitmq.queue.name=AY2526
rabbitmq.exchange.name=AY2526_exchange
rabbitmq.routing.key=AY2526_routing_key

# app.jwt.secret=${JWT_SECRET:dummy-jwt-secret-for-dev}
app.jwt.secret=${JWT_SECRET:lamwaihinisagoodguyhealwaysgotoschoolbybusandhewouldliketopreparedinnerforhisfamilyeveryday}

# Gemini (server-side proxy — key never sent to browser)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.proxy-host=${GEMINI_PROXY_HOST:}
app.gemini.proxy-port=${GEMINI_PROXY_PORT:0}

# OAuth2 social login (optional — leave blank to disable a provider)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.github.client-id=${GITHUB_CLIENT_ID:}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

# Public site URL used for OAuth redirects (no trailing slash)
DOMAIN=${DOMAIN:http://localhost}

# Email service (SMTP send + IMAP inbox read)
# Gmail: SMTP=smtp.gmail.com, IMAP=imap.gmail.com, use an App Password (not your login password)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.imap.host=${SPRING_MAIL_IMAP_HOST:imap.gmail.com}
